# MaxIOFS configuration.
#
# Everything here is read once, at startup. The rest of the settings — quotas,
# rate limits, email, retention, alerts — live in the database and are changed
# from the console under Settings, without restarting.
#
# Every key can also be set as an environment variable: MAXIOFS_ prefix, upper
# case, nested keys joined with an underscore. MAXIOFS_STORAGE_ROOT, for
# instance.

# S3 API.
listen: ":8080"

# Web console.
console_listen: ":8081"

# Inter-node traffic. Only reached by other nodes of the cluster.
cluster_listen: ":8082"

# Address the other nodes should reach this one at. Set it when the node cannot
# work it out itself, which is most of the time under Docker or Kubernetes.
cluster_advertise_address: ""

# Objects, metadata and the database. Packages use /var/lib/maxiofs; the
# container image uses /data.
data_dir: "./data"

# debug, info, warn, error
log_level: "info"

# The addresses clients reach this server at. They go into presigned URLs,
# redirects and the endpoint advertised to Veeam, so a wrong value breaks those
# and nothing else.
public_api_url: "http://localhost:8080"
public_console_url: "http://localhost:8081"

# Domain serving buckets as static websites, as <bucket>.<website_hostname>.
website_hostname: ""

# TLS. Both files are required when it is on.
enable_tls: false
cert_file: ""
key_file: ""

# Public addresses of proxies in front of this server, so the client IP in logs
# and rate limits is the real one. Private ranges are trusted already.
trusted_proxies: []

storage:
  # Only "filesystem" today.
  backend: "filesystem"

  # Where objects go. Empty means <data_dir>/objects.
  root: ""

  # Seeds the master key (KEK) on the FIRST start of an empty deployment, and is
  # ignored on every start after that: the key lives in the database from then
  # on, and rotating it is done from the console.
  #
  # Leave it empty and the first start generates one. Back up the database —
  # that is where the key is. 64 hex characters, openssl rand -hex 32.
  encryption_key: ""

  # Allow buckets to be created with S3 Object Lock, which makes their objects
  # undeletable until their retention expires. It cannot be turned off for a
  # bucket once created.
  enable_object_lock: false

  # Pebble block cache. Raise it on servers with many objects and spare memory.
  metadata_cache_size_mb: 256

auth:
  # Off means the S3 API accepts ANY credentials and the console lets anyone in
  # as the administrator. For a server nobody else can reach.
  enable_auth: true

  # Signs console sessions. Generated and stored in the database on first start
  # if left empty. Changing it logs everyone out.
  jwt_secret: ""

  # Encrypts the secrets of identity providers, replication targets and share
  # links before they are stored. Not an S3 credential. Falls back to
  # jwt_secret when empty, and changing it makes what was stored with the
  # previous value unreadable.
  encryption_secret: ""

audit:
  enable: true
  retention_days: 90
  # Empty means <data_dir>/db/audit.db
  db_path: ""

metrics:
  enable: true
  path: "/metrics"
  # Seconds between collections.
  interval: 30

replication:
  # Permit replication targets on private addresses. Off by default because a
  # target the operator does not control could be used to probe the network.
  allow_internal_endpoints: false
